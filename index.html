<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Academic Clearance Portal</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <header class="login-header">
        <h1>Clearance Portal</h1>
        <p>Sign in to your clearance account</p>
      </header>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username or Student ID</label>
          <input type="text" id="username" autocomplete="username" placeholder="e.g., 202410351 or admin" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
            <button type="button" id="togglePassword" class="btn-toggle-password">Show</button>
          </div>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <button type="submit" class="btn-submit">Sign In</button>
      </form>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
